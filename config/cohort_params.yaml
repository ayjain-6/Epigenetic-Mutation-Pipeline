# Epigenetic-Mutation-Pipeline Configuration (PRC2 & EZHIP Axis)

project:
  name: "Epigenetic-Mutation-Pipeline"
  description: "Multi-database clinical & functional analysis of PRC2 complex (EZH2, SUZ12, EED) and EZHIP"
  genome_build: "GRCh38"

genes:
  - "EZH2"
  - "SUZ12"
  - "EED"
  - "EZHIP"

filters:
  gnomad_max_maf: 0.001
  alpha_missense_pathogenic: 0.564
  cosmic_min_recurrence: 5

depmap:
  dependencies_to_track:
    - "EZH2"
    - "SUZ12"
    - "EED"
    - "CBX2"
