# Epigenetic-Mutation-Pipeline Configuration

project:
  name: "Epigenetic-Mutation-Pipeline"
  description: "Multi-database clinical & functional analysis of DAXX/ATRX/H3.3 axis"
  genome_build: "GRCh38"

genes:
  - "H3F3A"
  - "ATRX"
  - "DAXX"

filters:
  gnomad_max_maf: 0.001          # Filter out common germline variants (>0.1%)
  alpha_missense_pathogenic: 0.564
  cosmic_min_recurrence: 5        # Minimum tumor samples to flag as a hotspot

depmap:
  dependencies_to_track:
    - "PARP1"
    - "ATRX"
    - "DAXX"
